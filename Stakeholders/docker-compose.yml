version: '3.9'

services:
  stakeholders-server:
    container_name: stakeholders-server
    image: stakeholders/go-server:1.0
    build: .
    environment:
      DATABASE_URL: "host=go_db user=postgres password=postgres dbname=SOA sslmode=disable"
    ports:
      - 8082:8082
    depends_on:
      - go_db
  go_db:
    container_name: go_db
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: SOA
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: {}